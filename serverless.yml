service: proyecto-serverless
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x

  iam:
    role: arn:aws:iam::533683209172:role/LabRole

  environment:
    USERS_TABLE: TablaUsuariosProyectoServerless
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASS: ${env:DB_PASS}
    DB_NAME: ${env:DB_NAME}

functions:
  login:
    handler: handlers/auth.login
    events:
      - http:
          path: login
          method: POST

  users:
    handler: handlers/users.getUsers
    events:
      - http:
          path: users
          method: GET

  getUser:
    handler: handlers/crud.getUser
    events:
      - http:
          path: getUser
          method: POST

  createUser:
    handler: handlers/crud.createUser
    events:
      - http:
          path: createUser
          method: POST

